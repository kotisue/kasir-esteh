<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir - Dashboard Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f6f9; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 800px; }
        h2, h3 { color: #2c3e50; margin-bottom: 15px; border-bottom: 3px solid #3498db; padding-bottom: 8px; }
        
        .control-panel { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; background: #eef2f7; padding: 15px; border-radius: 10px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 150px; }
        .form-group label { font-size: 13px; font-weight: bold; color: #4a5568; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; }
        
        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; font-size: 14px; }
        .btn-primary { background: #3498db; }
        .btn-success { background: #2ecc71; }
        .btn-dark { background: #34495e; }
        .btn:hover { opacity: 0.9; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #34495e; color: white; }
        tr:nth-child(even) { background: #f8f9fa; }
        .text-right { text-align: right; }
        .color-in { color: #2ecc71; font-weight: bold; }
        .color-out { color: #e74c3c; font-weight: bold; }

        /* Gaya Khusus Cetak / Print Struk Laporan */
        #area_cetak_laporan { display: none; background: white; color: black; padding: 30px; font-family: 'Courier New', monospace; }
        .print-title { text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .print-subtitle { text-align: center; font-size: 14px; margin-bottom: 20px; border-bottom: 2px dashed #000; padding-bottom: 10px; }

        @media print {
            body * { visibility: hidden; }
            #area_cetak_laporan, #area_cetak_laporan * { visibility: visible; }
            #area_cetak_laporan { display: block !important; position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body>

<div class="container" id="main_admin_panel">
    <h2>👑 Dashboard Admin / Owner</h2>
    
    <!-- Panel Kontrol & Opsi Cetak -->
    <div class="control-panel">
        <div class="form-group">
            <label>Atur Modal Hari Ini (Rp):</label>
            <input type="number" id="input_modal_admin" placeholder="Contoh: 50000">
        </div>
        <div style="display: flex; align-items: flex-end; gap: 10px; width: 100%; margin-top: 10px;">
            <button class="btn btn-primary" onclick="simpanModalKeFirebase()">💾 Set Modal</button>
            <button class="btn btn-success" onclick="cetakLaporan('semua')">🖨️ Cetak Semua Riwayat</button>
            <!-- OPSI BARU: Cetak Hari Ini Saja -->
            <button class="btn btn-dark" onclick="cetakLaporan('hari_ini')">📅 Cetak Hari Ini Saja</button>
        </div>
    </div>

    <h3>📊 Riwayat Seluruh Transaksi</h3>
    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>Tanggal/Hari</th>
                    <th>Jam</th>
                    <th>Keterangan Penjualan / Pengeluaran</th>
                    <th class="text-right">Jumlah</th>
                </tr>
            </thead>
            <tbody id="tabel_admin_transaksi">
                <!-- Data otomatis load dari Firebase -->
            </tbody>
        </table>
    </div>
</div>

<!-- ================= AREA KHUSUS CETAK PRINTER ================= -->
<div id="area_cetak_laporan">
    <div class="print-title">🥤 LAPORAN KEUANGAN ES TEH & JERUK</div>
    <div class="print-subtitle" id="print_info_filter">Periode: Semua Data</div>
    
    <table style="width: 100%; margin-bottom: 20px;">
        <thead>
            <tr>
                <th style="background:#000; color:#fff;">Waktu</th>
                <th style="background:#000; color:#fff;">Keterangan</th>
                <th style="background:#000; color:#fff;" class="text-right">Jumlah</th>
            </tr>
        </thead>
        <tbody id="tabel_print_konten">
            <!-- Data filter masuk ke sini -->
        </tbody>
    </table>
    
    <div style="border-top: 2px dashed #000; padding-top: 10px; text-align: right; font-weight: bold; font-size: 16px;" id="print_total_ringkasan">
        <!-- Total Omset, Pengeluaran, Laba Bersih dihitung otomatis -->
    </div>
</div>

<script>
    // Proteksi Login Admin
    if (sessionStorage.getItem('role') !== 'admin') { window.location.href = "index.html"; }

    const FIREBASE_URL = "https://kasir-esteh-default-rtdb.asia-southeast1.firebasedatabase.app";
    let masterDataTransaksi = {}; // Menyimpan data mentah dari Firebase

    function dapatkanTanggalHariIni() {
        let s = new Date();
        return s.getFullYear() + "-" + (s.getMonth()+1).toString().padStart(2, '0') + "-" + s.getDate().toString().padStart(2, '0');
    }

    function simpanModalKeFirebase() {
        let tgl = dapatkanTanggalHariIni();
        let nominal = parseInt(document.getElementById('input_modal_admin').value) || 0;
        if(nominal <= 0) return alert("Masukkan nominal modal dengan benar!");

        fetch(`${FIREBASE_URL}/modal/${tgl}.json`, {
            method: 'PUT',
            body: JSON.stringify(nominal)
        }).then(() => {
            alert("Modal hari ini berhasil diset!");
            document.getElementById('input_modal_admin').value = '';
        });
    }

    // Ambil Data Transaksi Secara Live
    function muatDataTransaksiAdmin() {
        setInterval(() => {
            fetch(`${FIREBASE_URL}/transaksi.json`).then(res => res.json()).then(data => {
                let tbody = document.getElementById('tabel_admin_transaksi');
                tbody.innerHTML = '';
                if (!data) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Belum ada riwayat transaksi.</td></tr>';
                    masterDataTransaksi = {};
                    return;
                }
                
                masterDataTransaksi = data; // Simpan ke variabel global untuk dipakai fitur cetak
                
                // Looping tanggal dan ID transaksi
                Object.keys(data).reverse().forEach(tanggal => {
                    Object.values(data[tanggal]).reverse().forEach(item => {
                        tbody.insertAdjacentHTML('beforeend', `
                            <tr>
                                <td><b>${tanggal}</b></td>
                                <td>${item.waktu}</td>
                                <td>${item.keterangan}</td>
                                <td class="text-right ${item.tipe === 'pemasukan' ? 'color-in' : 'color-out'}">
                                    ${item.tipe === 'pemasukan' ? '+' : '-'} Rp ${item.jumlah.toLocaleString('id-ID')}
                                </td>
                            </tr>
                        `);
                    });
                });
            });
        }, 3000);
    }

    // FUNGSI UTAMA: Cetak dengan Pilihan Opsi Filter
    function cetakLaporan(opsi) {
        let tglHariIni = dapatkanTanggalHariIni();
        let tabelPrint = document.getElementById('tabel_print_konten');
        let infoFilter = document.getElementById('print_info_filter');
        let ringkasanText = document.getElementById('print_total_ringkasan');
        
        tabelPrint.innerHTML = '';
        let totalPemasukan = 0;
        let totalPengeluaran = 0;

        if (Object.keys(masterDataTransaksi).length === 0) {
            return alert("Tidak ada data yang bisa dicetak!");
        }

        if (opsi === 'hari_ini') {
            infoFilter.innerText = "Periode: HARI INI SAJA (" + new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) + ")";
            
            // Hanya ambil data yang key tanggalnya sama dengan hari ini
            if (masterDataTransaksi[tglHariIni]) {
                Object.values(masterDataTransaksi[tglHariIni]).forEach(item => {
                    if (item.tipe === 'pemasukan') totalPemasukan += item.jumlah; else totalPengeluaran += item.jumlah;
                    
                    tabelPrint.insertAdjacentHTML('beforeend', `
                        <tr>
                            <td>${item.waktu}</td>
                            <td>${item.keterangan}</td>
                            <td class="text-right">${item.tipe === 'pemasukan' ? '+' : '-'} ${item.jumlah.toLocaleString('id-ID')}</td>
                        </tr>
                    `);
                });
            } else {
                return alert("Belum ada transaksi masuk untuk hari ini!");
            }
        } else {
            // Cetak Semua Riwayat
            infoFilter.innerText = "Periode: Semua Riwayat Transaksi";
            Object.keys(masterDataTransaksi).forEach(tanggal => {
                Object.values(masterDataTransaksi[tanggal]).forEach(item => {
                    if (item.tipe === 'pemasukan') totalPemasukan += item.jumlah; else totalPengeluaran += item.jumlah;
                    
                    tabelPrint.insertAdjacentHTML('beforeend', `
                        <tr>
                            <td>${tanggal} ${item.waktu}</td>
                            <td>${item.keterangan}</td>
                            <td class="text-right">${item.tipe === 'pemasukan' ? '+' : '-'} ${item.jumlah.toLocaleString('id-ID')}</td>
                        </tr>
                    `);
                });
            });
        }

        // Hitung total laba bersih di struk print
        let labaBersih = totalPemasukan - totalPengeluaran;
        ringkasanText.innerHTML = `
            <div>Total Omset (Masuk): Rp ${totalPemasukan.toLocaleString('id-ID')}</div>
            <div>Total Pengeluaran: Rp ${totalPengeluaran.toLocaleString('id-ID')}</div>
            <div style="font-size:18px; margin-top:5px; color:#000;">💰 LABA BERSIH: Rp ${labaBersih.toLocaleString('id-ID')}</div>
        `;

        // Trigger perintah cetak browser
        window.print();
    }

    muatDataTransaksiAdmin();
</script>
</body>
</html>
