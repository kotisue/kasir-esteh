<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Sistem Kasir</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f0f3f5; height: 100vh; display: flex; justify-content: center; align-items: center; padding: 12px; }
        .login-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); width: 100%; max-width: 360px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 20px; font-size: 22px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; text-align: left; }
        .form-group label { font-size: 13px; font-weight: bold; color: #4a5568; }
        .form-group input { padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 14px; outline: none; }
        .btn-login { width: 100%; padding: 12px; background: #2c3e50; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .error-msg { color: #e74c3c; font-size: 13px; margin-top: 10px; display: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>🔒 Login Kasir & Admin</h2>
    <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Masukkan username">
    </div>
    <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Masukkan password">
    </div>
    <button class="btn-login" onclick="cekLogin()">Masuk Aplikasi</button>
    <div class="error-msg" id="pesan_error">Username atau Password Salah!</div>
</div>

<script>
    function cekLogin() {
        let userIn = document.getElementById('username').value.trim();
        let passIn = document.getElementById('password').value;
        let errorBox = document.getElementById('pesan_error');

        // Sembunyikan pesan error dulu setiap kali tombol ditekan
        errorBox.style.display = 'none';

        if (userIn === "kasir" && passIn === "esteh123") {
            sessionStorage.setItem('role', 'kasir');
            window.location.href = "kasir.html";
        } else if (userIn === "admin" && passIn === "admin123") {
            sessionStorage.setItem('role', 'admin');
            window.location.href = "admin.html";
        } else {
            errorBox.style.display = 'block';
        }
    }
</script>
</body>
</html>
