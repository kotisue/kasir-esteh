<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Es Teh & Jeruk</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f6f9; padding: 15px; color: #333; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #2c3e50; color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 15px; }
        .header h1 { font-size: 18px; }
        .header .info { font-size: 12px; text-align: right; }
        .btn-logout { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        
        .container { display: grid; grid-template-columns: 1fr; gap: 15px; max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 18px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card-title { font-size: 15px; font-weight: bold; color: #2c3e50; margin-bottom: 12px; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
        
        .grid-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .box-summary { padding: 12px; border-radius: 8px; text-align: center; color: white; font-weight: bold; }
        .box-modal { background: #e67e22; }
        .box-laci { background: #27ae60; }
        .box-summary .val { font-size: 18px; display: block; margin-top: 4px; }

        .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .btn-menu { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; color: white; transition: 0.2s; }
        .btn-menu:active { transform: scale(0.98); }
        .btn-teh { background: #d35400; }
        .btn-jeruk { background: #f39c12; }
        .btn-pengeluaran { background: #c0392b; grid-column: span 2; }

        .form-inline { display: flex; gap: 8px; margin-bottom: 15px; }
        .form-inline input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; outline: none; }
        .btn-action { padding: 10px 15px; background: #3498db; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .table-wrap { max-height: 250px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #edf2f7; }
        th { background: #f7fafc; color: #4a5568; position: sticky; top: 0; }
        .c-in { color: #27ae60; font-weight: bold; }
        .c-out { color: #c0392b; font-weight: bold; }
        
        .chat-box { height: 120px; overflow-y: auto; border: 1px solid #cbd5e0; padding: 8px; border-radius: 6px; background: #f8fafc; font-size: 12px; margin-bottom: 8px; }
        .chat-item { margin-bottom: 4px; }
        .chat-item.pegawai { color: #2980b9; text-align: right; }
        .chat-item.admin { color: #8e44ad; text-align: left; }

        .closing-area { background: #fff3cd; border: 1px solid #ffeeba; border-radius: 8px; padding: 12px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1 id="nama_cabang_txt">Kasir Store</h1>
            <div style="font-size:11px; opacity: 0.8;" id="tgl_skrg_txt">...</div>
        </div>
        <div class="info">
            <span id="role_txt">Kasir</span><br>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="card">
        <div class="card-title">💵 Ringkasan Keuangan Laci</div>
        <div class="grid-summary">
            <div class="box-summary box-modal">
                Modal Awal
                <span class="val" id="lbl_modal">Rp 0</span>
            </div>
            <div class="box-summary box-laci">
                Uang Di Laci
                <span class="val" id="lbl_laci">Rp 0</span>
            </div>
        </div>

        <div class="card-title">🍹 Input Transaksi Cepat</div>
        <div class="btn-grid">
            <button class="btn-menu btn-teh" onclick="tambahTransaksi('Es Teh Manis', 3000, 'pemasukan')">+ Es Teh (Rp 3.000)</button>
            <button class="btn-menu btn-jeruk" onclick="tambahTransaksi('Es Jeruk Segar', 4000, 'pemasukan')">+ Es Jeruk (Rp 4.000)</button>
        </div>

        <div class="card-title">📝 Input Transaksi Manual / Pengeluaran</div>
        <div class="form-inline">
            <input type="text" id="inp_ket" placeholder="Keterangan (misal: Es Batu / Plastik)...">
            <input type="number" id="inp_jml" placeholder="Nominal (Rp)..." style="width: 110px;">
        </div>
        <div style="display: flex; gap: 8px; margin-bottom: 15px;">
            <button class="btn-action" style="flex:1; background:#27ae60;" onclick="inputManual('pemasukan')">+ Pemasukan</button>
            <button class="btn-action" style="flex:1; background:#c0392b;" onclick="inputManual('pengeluaran')">- Pengeluaran</button>
        </div>

        <div class="card-title">📊 Riwayat Transaksi Hari Ini</div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Jam</th>
                        <th>Keterangan</th>
                        <th style="text-align:right;">Total</th>
                    </tr>
                </thead>
                <tbody id="tbl_transaksi">
                    <tr><td colspan="3" style="text-align:center; color:#aaa;">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <div class="card-title">💬 Chat / Instruksi Owner (Admin)</div>
        <div class="chat-box" id="chat_container"></div>
        <div class="form-inline" style="margin-bottom: 0;">
            <input type="text" id="inp_chat" placeholder="Tulis pesan ke admin...">
            <button class="btn-action" style="background:#8e44ad;" onclick="kirimChat()">Kirim</button>
        </div>
    </div>

    <div class="card closing-area">
        <div class="card-title" style="color: #856404; border-bottom-color: #ffeeba;">🔒 Laporan Closing Toko</div>
        <div class="form-inline" style="margin-bottom: 8px;">
            <input type="text" id="inp_closing_note" placeholder="Catatan closing (misal: Sisa Es 2 pack, Laci Pas)...">
        </div>
        <button class="btn-action" style="width: 100%; background: #d35400;" onclick="kirimClosing()">KIRIM LAPORAN CLOSING</button>
    </div>
</div>

<script>
    if (sessionStorage.getItem('role') !== 'kasir') { window.location.href = "index.html"; }

    const FIREBASE_URL = "https://kasir-esteh-default-rtdb.asia-southeast1.firebasedatabase.app";
    const ID_CABANG = sessionStorage.getItem('cabang') || 'cabang_1';
    const NAMA_CABANG = sessionStorage.getItem('nama_cabang') || 'Cabang 1';

    document.getElementById('nama_cabang_txt').innerText = NAMA_CABANG;

    function dapatkanTanggalAktif() {
        let s = new Date();
        return s.getFullYear() + "-" + (s.getMonth()+1).toString().padStart(2, '0') + "-" + s.getDate().toString().padStart(2, '0');
    }

    function dapatkanWaktu() {
        let s = new Date();
        return s.getHours().toString().padStart(2, '0') + ":" + s.getMinutes().toString().padStart(2, '0');
    }

    const tanggalAktif = dapatkanTanggalAktif();
    document.getElementById('tgl_skrg_txt').innerText = "Tanggal: " + tanggalAktif;

    let modalHariIni = 0;

    function tambahTransaksi(keterangan, jumlah, tipe) {
        let jam = dapatkanWaktu();
        let payload = { waktu: jam, keterangan: keterangan, jumlah: parseInt(jumlah), tipe: tipe };

        fetch(`${FIREBASE_URL}/${ID_CABANG}/transaksi/${tanggalAktif}.json`, {
            method: 'POST',
            body: JSON.stringify(payload)
        }).then(() => muatDataLive());
    }

    function inputManual(tipe) {
        let ket = document.getElementById('inp_ket').value.trim();
        let jml = parseInt(document.getElementById('inp_jml').value) || 0;

        if (!ket || jml <= 0) { alert("Isi keterangan dan nominal dengan benar!"); return; }

        tambahTransaksi(ket, jml, tipe);
        document.getElementById('inp_ket').value = '';
        document.getElementById('inp_jml').value = '';
    }

    function kirimChat() {
        let msg = document.getElementById('inp_chat').value.trim();
        if (!msg) return;

        let payload = { pengirim: 'pegawai', waktu: dapatkanWaktu(), teks: msg };
        fetch(`${FIREBASE_URL}/${ID_CABANG}/chat/${tanggalAktif}.json`, {
            method: 'POST',
            body: JSON.stringify(payload)
        }).then(() => {
            document.getElementById('inp_chat').value = '';
            muatChat();
        });
    }

    function kirimClosing() {
        let note = document.getElementById('inp_closing_note').value.trim() || 'Toko Tutup / Closing';
        let payload = { waktu: dapatkanWaktu(), catatan: note };

        fetch(`${FIREBASE_URL}/${ID_CABANG}/closing/${tanggalAktif}.json`, {
            method: 'PUT',
            body: JSON.stringify(payload)
        }).then(() => {
            alert("Laporan Closing Berhasil Dikirim ke Admin!");
            document.getElementById('inp_closing_note').value = '';
        });
    }

    function muatDataLive() {
        // 1. Muat Modal
        fetch(`${FIREBASE_URL}/${ID_CABANG}/modal/${tanggalAktif}.json`)
        .then(res => res.json())
        .then(m => {
            modalHariIni = parseInt(m) || 0;
            document.getElementById('lbl_modal').innerText = "Rp " + modalHariIni.toLocaleString('id-ID');
            
            // 2. Muat Transaksi
            return fetch(`${FIREBASE_URL}/${ID_CABANG}/transaksi/${tanggalAktif}.json`);
        })
        .then(res => res.json())
        .then(data => {
            let tbl = document.getElementById('tbl_transaksi');
            let totalIn = 0, totalOut = 0;

            if (!data) {
                tbl.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#aaa;">Belum ada transaksi hari ini.</td></tr>';
            } else {
                tbl.innerHTML = '';
                Object.values(data).reverse().forEach(item => {
                    if (item.tipe === 'pemasukan') totalIn += item.jumlah;
                    else if (item.tipe === 'pengeluaran') totalOut += item.jumlah;

                    tbl.insertAdjacentHTML('beforeend', `
                        <tr>
                            <td>${item.waktu || '-'}</td>
                            <td>${item.keterangan || '-'}</td>
                            <td style="text-align:right;" class="${item.tipe === 'pemasukan' ? 'c-in' : 'c-out'}">
                                ${item.tipe === 'pemasukan' ? '+' : '-'} Rp ${(item.jumlah || 0).toLocaleString('id-ID')}
                            </td>
                        </tr>
                    `);
                });
            }

            let laci = modalHariIni + (totalIn - totalOut);
            document.getElementById('lbl_laci').innerText = "Rp " + laci.toLocaleString('id-ID');
        });
    }

    function muatChat() {
        fetch(`${FIREBASE_URL}/${ID_CABANG}/chat/${tanggalAktif}.json`)
        .then(res => res.json())
        .then(data => {
            let box = document.getElementById('chat_container');
            box.innerHTML = '';
            if (data) {
                Object.values(data).forEach(c => {
                    let textMsg = c.teks || c.pesan || c.text || '';
                    let sender = c.pengirim === 'pegawai' ? 'Saya' : 'Admin';
                    let cssClass = c.pengirim === 'pegawai' ? 'pegawai' : 'admin';
                    box.insertAdjacentHTML('beforeend', `
                        <div class="chat-item ${cssClass}">
                            <b>${sender} [${c.waktu || ''}]:</b> ${textMsg}
                        </div>
                    `);
                });
                box.scrollTop = box.scrollHeight;
            } else {
                box.innerHTML = '<center style="color:#aaa; font-size:11px;">Belum ada pesan.</center>';
            }
        });
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = "index.html";
    }

    // Auto Refresh setiap 3 detik
    setInterval(() => {
        muatDataLive();
        muatChat();
    }, 3000);

    muatDataLive();
    muatChat();
</script>
</body>
</html>
