<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kasir Toko - Sisi Pegawai</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #1a202c; color: #fff; padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .wrapper, .info-box { width: 100%; max-width: 600px; background: #2d3748; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        h2 { text-align: center; margin-bottom: 15px; color: #f1c40f; border-bottom: 2px solid #f1c40f; padding-bottom: 5px; }
        .info-modal-hari-ini { background: #2980b9; padding: 12px; text-align: center; font-weight: bold; font-size: 15px; border-radius: 8px; margin-bottom: 12px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .box { padding: 15px; border-radius: 10px; text-align: center; font-weight: bold; font-size: 13px; }
        .in { background: #27ae60; } .out { background: #c0392b; }
        .wajib-serah { grid-column: span 2; background: #e67e22; font-size: 15px; }
        .val { display: block; font-size: 18px; margin-top: 5px; color: #fff; }
        .wajib-serah .val { color: #f1c40f; font-size: 24px; }
        .form-inline { display: flex; gap: 8px; margin-bottom: 15px; }
        .form-inline input, .form-inline select { flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 14px; outline: none; background: #fff; color: #000; }
        .btn-action { padding: 10px 15px; border: none; background: #f1c40f; color: #1a202c; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .table-wrap { background: #1a202c; border-radius: 8px; padding: 10px; max-height: 200px; overflow-y: auto; border: 1px solid #4a5568; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        th, td { padding: 8px; border-bottom: 1px solid #4a5568; }
        th { background: #4a5568; color: #f1c40f; position: sticky; top: 0; }
        .text-right { text-align: right; }
        .c-in { color: #2ecc71; font-weight: bold; } .c-out { color: #e74c3c; font-weight: bold; }
        .chat-area { max-height: 120px; overflow-y: auto; background: #1a202c; border: 1px solid #4a5568; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 12px; }
        .chat-line { margin-bottom: 5px; } .chat-line.admin { color: #f48fb1; } .chat-line.me { color: #5dade2; text-align: right; }
    </style>
</head>
<body>

<div style="width: 100%; max-width: 600px; text-align: right;">
    <button onclick="logout()" style="padding: 6px 12px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer;">Logout</button>
</div>

<div class="info-box" style="margin-bottom: -5px;">
    <div class="info-modal-hari-ini">💰 MODAL AWAL HARI INI: <span id="txt_modal_kasir">Rp 0</span></div>
    
    <div class="grid">
        <div class="box in">🟢 OMSET MASUK <span class="val" id="ksr_masuk">Rp 0</span></div>
        <div class="box out">🔴 PENGELUARAN TOKO <span class="val" id="ksr_keluar">Rp 0</span></div>
        <div class="box wajib-serah">🏢 TOTAL UANG WAJIB ADA DI LACI (TERMASUK MODAL)<span class="val" id="ksr_wajib">Rp 0</span></div>
    </div>
</div>

<div class="wrapper">
    <h2>🔌 INPUT TRANSAKSI BARU</h2>
    <div class="form-inline">
        <select id="input_tipe">
            <option value="pemasukan">🟢 Omset / Penjualan</option>
            <option value="pengeluaran">🔴 Pengeluaran Toko</option>
        </select>
        <input type="text" id="input_keterangan" placeholder="Keterangan (Contoh: Es Teh 3 / Beli Cup)">
        <input type="number" id="input_jumlah" placeholder="Total (Rp)">
        <button class="btn-action" onclick="tambahTransaksi()">Simpan</button>
    </div>

    <div class="table-wrap">
        <table>
            <thead><tr><th>Jam</th><th>Keterangan</th><th class="text-right">Jumlah</th></tr></thead>
            <tbody id="ksr_tabel"></tbody>
        </table>
    </div>

    <h3 style="font-size: 13px; color: #e67e22; margin-bottom: 5px;">📢 KIRIM LAPORAN PENUTUPAN TOKO (CLOSING)</h3>
    <div class="form-inline">
        <input type="text" id="input_closing_catatan" placeholder="Tulis catatan penutupan (Contoh: Stok Cup sisa 10, uang pas)">
        <button class="btn-action" style="background:#e67e22; color:white;" onclick="kirimClosing()">Kirim Laporan Closing</button>
    </div>

    <h3 style="font-size: 13px; color: #9b59b6; margin-bottom: 5px;">💬 KOTAK OBROLAN DENGAN BOS (OWNER):</h3>
    <div class="chat-area" id="kasir_chat_box"></div>
    <div class="form-inline">
        <input type="text" id="kasir_pesan_teks" placeholder="Balas pesan ke owner...">
        <button class="btn-action" style="background:#9b59b6; color:white;" onclick="kirimChatKasir()">Kirim</button>
    </div>
</div>

<script>
    if (sessionStorage.getItem('role') !== 'kasir') { window.location.href = "index.html"; }

    const FIREBASE_URL = "https://kasir-esteh-default-rtdb.asia-southeast1.firebasedatabase.app";
    let tanggalHariIni = dapatkanTanggalHariIni();
    let modalKasirGlobal = 0;

    function dapatkanTanggalHariIni() {
        let s = new Date();
        return s.getFullYear() + "-" + (s.getMonth()+1).toString().padStart(2, '0') + "-" + s.getDate().toString().padStart(2, '0');
    }

    function tambahTransaksi() {
        let tipe = document.getElementById('input_tipe').value;
        let keterangan = document.getElementById('input_keterangan').value.trim();
        let jumlah = parseInt(document.getElementById('input_jumlah').value) || 0;

        if(keterangan === "" || jumlah <= 0) return alert("Data input belum lengkap!");

        let s = new Date();
        let jam = s.getHours().toString().padStart(2, '0') + ':' + s.getMinutes().toString().padStart(2, '0');

        fetch(`${FIREBASE_URL}/transaksi/${tanggalHariIni}.json`, {
            method: 'POST',
            body: JSON.stringify({ waktu: jam, tipe: tipe, keterangan: keterangan, jumlah: jumlah })
        }).then(() => {
            document.getElementById('input_keterangan').value = '';
            document.getElementById('input_jumlah').value = '';
        });
    }

    function kirimClosing() {
        let catatan = document.getElementById('input_closing_catatan').value.trim();
        if(catatan === "") return alert("Isi catatan kondisi closing malam ini!");
        let s = new Date();
        let jam = s.getHours().toString().padStart(2, '0') + ':' + s.getMinutes().toString().padStart(2, '0');

        fetch(`${FIREBASE_URL}/closing/${tanggalHariIni}.json`, {
            method: 'PUT',
            body: JSON.stringify({ waktu: jam, catatan: catatan })
        }).then(() => { 
            alert("Laporan closing terkirim, terima kasih!"); 
            document.getElementById('input_closing_catatan').value = ''; 
        });
    }

    function kirimChatKasir() {
        let msg = document.getElementById('kasir_pesan_teks').value.trim();
        if (msg === "") return;
        let s = new Date();
        let jam = s.getHours().toString().padStart(2, '0') + ':' + s.getMinutes().toString().padStart(2, '0');
        fetch(`${FIREBASE_URL}/chat/${tanggalHariIni}.json`, {
            method: 'POST',
            body: JSON.stringify({ pengirim: 'pegawai', waktu: jam, teks: msg })
        }).then(() => { document.getElementById('kasir_pesan_teks').value = ''; });
    }

    function jalankanPantauLiveKasir() {
        setInterval(() => {
            // 1. Sinkronisasi nominal modal awal dari owner
            fetch(`${FIREBASE_URL}/modal/${tanggalHariIni}.json`).then(res => res.json()).then(m_nominal => {
                modalKasirGlobal = parseInt(m_nominal) || 0;
                document.getElementById('txt_modal_kasir').innerText = 'Rp ' + modalKasirGlobal.toLocaleString('id-ID');
            });

            // 2. Ambil Transaksi Jualan & Pengeluaran
            fetch(`${FIREBASE_URL}/transaksi/${tanggalHariIni}.json`).then(res => res.json()).then(data => {
                let tabel = document.getElementById('ksr_tabel'); tabel.innerHTML = '';
                let totalP = 0, totalK = 0;

                if (!data) {
                    tabel.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#aaa;">Belum ada transaksi hari ini.</td></tr>';
                    document.getElementById('ksr_masuk').innerText = 'Rp 0';
                    document.getElementById('ksr_keluar').innerText = 'Rp 0';
                    document.getElementById('ksr_wajib').innerText = 'Rp ' + modalKasirGlobal.toLocaleString('id-ID');
                    return;
                }

                Object.values(data).reverse().forEach(item => {
                    if (item.tipe === 'pemasukan') totalP += item.jumlah; else totalK += item.jumlah;
                    tabel.insertAdjacentHTML('beforeend', `
                        <tr>
                            <td>${item.waktu}</td>
                            <td>${item.keterangan}</td>
                            <td class="text-right ${item.tipe==='pemasukan'?'c-in':'c-out'}">${item.tipe==='pemasukan'?'+':'-'} Rp ${item.jumlah.toLocaleString('id-ID')}</td>
                        </tr>
                    `);
                });

                document.getElementById('ksr_masuk').innerText = 'Rp ' + totalP.toLocaleString('id-ID');
                document.getElementById('ksr_keluar').innerText = 'Rp ' + totalK.toLocaleString('id-ID');
                // Rumus Laci: Modal + Omset Masuk - Pengeluaran
                document.getElementById('ksr_wajib').innerText = 'Rp ' + (modalKasirGlobal + (totalP - totalK)).toLocaleString('id-ID');
            });

            // 3. Ambil Chat Box
            fetch(`${FIREBASE_URL}/chat/${tanggalHariIni}.json`).then(res => res.json()).then(data => {
                let box = document.getElementById('kasir_chat_box'); box.innerHTML = '';
                if(data) {
                    Object.values(data).forEach(c => {
                        box.insertAdjacentHTML('beforeend', `<div class="chat-line ${c.pengirim==='admin'?'admin':'me'}"><b>${c.pengirim==='admin'?'Owner':'Anda'} [${c.waktu}]:</b> ${c.teks}</div>`);
                    });
                    box.scrollTop = box.scrollHeight;
                } else { box.innerHTML = '<center style="color:#777; font-size:11px;">Belum ada obrolan.</center>'; }
            });
        }, 3000);
    }

    function logout() { sessionStorage.clear(); window.location.href = "index.html"; }
    jalankanPantauLiveKasir();
</script>
</body>
</html>
